<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M6 3h12l4 6-10 12L2 9Z%27 fill=%27%23ec7211%27/%3E%3C/svg%3E">
  <title>Sign in · Pratishtha Bridal</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/rental.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: var(--s-4); }
    .login { width: min(420px, 100%); }
    .login .brandrow { display: flex; align-items: center; gap: var(--s-3); justify-content: center; margin-bottom: var(--s-5); }
    .login .mark { width: 44px; height: 44px; border-radius: 10px; background: var(--c-accent-600); color: #fff; display: grid; place-items: center; }
    .login .mark svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .roles { display: grid; gap: var(--s-3); }
    .roles button { text-align: left; height: auto; padding: var(--s-3) var(--s-4); border-radius: var(--radius-md); display: grid; gap: 2px; justify-content: start; justify-items: start; white-space: normal; }
    .roles small { font-weight: 400; color: var(--c-text-muted); }
  </style>
</head>
<body>
<main class="login">
  <div class="brandrow"><span class="mark"><svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M2 9h20M9 3l3 6 3-6M12 21 9 9M12 21l3-12"/></svg></span><h1 id="shop">Pratishtha Bridal</h1></div>

  <section class="card" id="live" hidden>
    <div class="card-header"><h2>Sign in</h2></div>
    <form class="card-body" id="form" style="display:grid;gap:var(--s-4)">
      <div class="alert warning" id="msg" hidden><div id="msg-t"></div></div>
      <div class="field"><label for="email">Email</label><input id="email" class="input" type="email" autocomplete="username" required autofocus></div>
      <div class="field"><label for="pw">Password</label><input id="pw" class="input" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-lg" id="go" style="width:100%">Sign in</button>
      <p class="hint-line" style="margin:0">Forgot your password? Ask the owner to reset it.</p>
    </form>
  </section>

  <section class="card" id="demo" hidden>
    <div class="card-header"><h2>Demo mode</h2></div>
    <div class="card-body" style="display:grid;gap:var(--s-4)">
      <div class="alert info"><div><strong>No server connected</strong>You are using sample data that stays only in this browser. To use real data, fill <code>js/config.js</code> (see SUPABASE.md).</div></div>
      <p class="muted" style="margin:0">Open the app as:</p>
      <div class="roles">
        <button class="btn" data-role="owner"><strong>Owner</strong><small>Everything: reports, settings, users, prices</small></button>
        <button class="btn" data-role="staff"><strong>Counter staff</strong><small>Bookings, returns, payments, customers</small></button>
        <button class="btn" data-role="stock"><strong>Stock keeper</strong><small>Inventory, calendar, tags only</small></button>
      </div>
    </div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script>
  const $ = (id) => document.getElementById(id), api = RR.api, qs = new URLSearchParams(location.search);
  const safeNext = (n) => (n && /^[a-z0-9\-]+\.html(\?[\w=&%.\-]*)?$/i.test(n) ? n : null);          // only same-folder pages, never an outside URL
  RR.ready.then(() => {
    if (api.error) { $('live').hidden = false; $('msg').hidden = false; $('msg-t').textContent = api.error.message; return; }
    if (!api.live) {
      $('demo').hidden = false;
      $('demo').addEventListener('click', (e) => { const b = e.target.closest('[data-role]'); if (!b) return; try { localStorage.setItem('rr:demo:role', b.dataset.role); } catch (x) { /* ignore */ } location.href = api.homeFor(b.dataset.role); });
      return;
    }
    if (api.user) { location.replace(safeNext(qs.get('next')) || api.homePage()); return; }       // already signed in
    $('live').hidden = false;
    if (qs.get('msg') === 'noaccess') { $('msg').hidden = false; $('msg-t').textContent = 'This account has no access. Ask the owner to activate it.'; }
  });
  $('form').addEventListener('submit', async (e) => {
    e.preventDefault(); $('go').disabled = true; $('go').textContent = 'Signing in…'; $('msg').hidden = true;
    try { await api.signIn($('email').value.trim(), $('pw').value); location.reload(); }
    catch (err) { $('msg').hidden = false; $('msg-t').textContent = err.message; $('go').disabled = false; $('go').textContent = 'Sign in'; }
  });
</script>
</body>
</html>
